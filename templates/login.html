<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSave - Kirish va Ro'yxatdan o'tish</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: bg-screen; height: 100vh; padding: 20px; }
        .card { background: white; padding: 40px; rounded-radius: 16px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); w-full: max-width; width: 100%; max-width: 400px; border-top: 5px solid #ff6b35; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #ff6b35; font-size: 32px; font-weight: bold; }
        .header p { color: #6b7280; font-size: 14px; margin-top: 5px; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 25px; border-b: 1px solid #e5e7eb; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-size: 16px; font-weight: 600; cursor: pointer; padding-bottom: 5px; width: 50%; text-align: center; color: #9ca3af; }
        .tab-btn.active-login { color: #ff6b35; border-bottom: 3px solid #ff6b35; }
        .tab-btn.active-reg { color: #10b981; border-bottom: 3px solid #10b981; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 15px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: #ff6b35; box-shadow: 0 0 0 3px rgba(255,107,53,0.15); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; color: white; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-orange { background-color: #ff6b35; }
        .btn-orange:hover { background-color: #e05621; }
        .btn-green { background-color: #10b981; }
        .btn-green:hover { background-color: #059669; }
        .hidden { display: none; }
        .alert { padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 15px; }
        .alert-success { background-color: #d1fae5; color: #065f46; }
        .alert-danger { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>FoodSave</h1>
            <p>Xalq va tadbirkorlar uchun manfaatli platforma</p>
        </div>

        <div class="tabs">
            <button id="tab-login" class="tab-btn active-login" onclick="switchTab('login')">Kirish</button>
            <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Ro'yxatdan o'tish</button>
        </div>

        <div id="alert-box" class="alert hidden"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email (Login)</label>
                <input type="email" id="login-email" required value="lolsopain@gmail.com">
            </div>
            <div class="form-group">
                <label>Parol</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn btn-orange">Tizimga kirish</button>
        </form>

        <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Foydalanuvchi nomi</label>
                <input type="text" id="reg-username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label>Telefon</label>
                <input type="text" id="reg-phone" placeholder="+998901234567">
            </div>
            <div class="form-group">
                <label>Rol</label>
                <select id="reg-role">
                    <option value="client">Mijoz (Client)</option>
                    <option value="owner">Restoran egasi (Owner)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <input type="password" id="reg-password" required>
            </div>
            <button type="submit" class="btn btn-green">Ro'yxatdan o'tish</button>
        </form>
    </div>

    <script>
        function switchTab(type) {
            const lForm = document.getElementById('login-form');
            const rForm = document.getElementById('register-form');
            const tLog = document.getElementById('tab-login');
            const tReg = document.getElementById('tab-register');
            
            if(type === 'login') {
                lForm.classList.remove('hidden'); rForm.classList.add('hidden');
                tLog.className = "tab-btn active-login";
                tReg.className = "tab-btn";
            } else {
                lForm.classList.add('hidden'); rForm.classList.remove('hidden');
                tLog.className = "tab-btn";
                tReg.className = "tab-btn active-reg";
            }
        }

        function showAlert(msg, isSuc) {
            const b = document.getElementById('alert-box'); 
            b.innerText = msg; 
            b.className = isSuc ? "alert alert-success" : "alert alert-danger";
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                const res = await fetch('/api/users/token/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if(res.ok) {
                    const data = await res.json();
                    localStorage.setItem('access', data.access);
                    window.location.href = '/foods-page/';
                } else { showAlert("Email yoki parol xato!", false); }
            } catch { window.location.href = '/foods-page/'; }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const data = {
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                phone: document.getElementById('reg-phone').value,
                role: document.getElementById('reg-role').value,
                password: document.getElementById('reg-password').value
            };
            const res = await fetch('/api/users/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if(res.ok) { showAlert("Muvaffaqiyatli ro'yxatdan o'tdingiz!", true); switchTab('login'); }
            else { showAlert("Xatolik yuz berdi!", false); }
        }
    </script>
</body>
</html>
