<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodSave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; }
        .login-card { border: none; border-radius: 16px; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 400px;">
    <div class="card p-4 shadow login-card mt-5">
        <h3 class="text-center text-success fw-bold mb-4">Login</h3>
        
        <div class="mb-3">
            <input type="text" id="username" class="form-control" placeholder="Username yoki Email">
        </div>
        <div class="mb-3">
            <input type="password" id="password" class="form-control" placeholder="Password">
        </div>

        <button class="btn btn-success w-100 fw-bold" onclick="login()">Kirish</button>

        <p class="text-danger mt-3 text-center small" id="error"></p>
    </div>
</div>

<script>
async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("error");
    
    errorEl.innerText = ""; // Eski xatolikni tozalash

    try {
        const response = await fetch("/api/token/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username, // 'email' o'rniga 'username' yuborilyapti
                password: password
            })
        });

        const data = await response.json();

        if (response.ok && data.access) {
            // Tokenni xotiraga saqlaymiz
            localStorage.setItem("token", data.access);
            if (data.refresh) {
                localStorage.setItem("refresh", data.refresh);
            }
            // Muvaffaqiyatli kirgach, ovqatlar sahifasiga o'tkazish
            window.location.href = "/foods-page/";
        } else {
            // Agar backend biror aniq xato xabari qaytarsa, o'shani ko'rsatadi
            errorEl.innerText = data.detail || "Username yoki parol xato!";
        }
    } catch (err) {
        console.error(err);
        errorEl.innerText = "Tarmoqda xatolik yuz berdi.";
    }
}
</script>

</body>
</html>
