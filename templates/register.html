<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish - FoodSave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; }
        .register-card { border: none; border-radius: 16px; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 400px;">
    <div class="card p-4 shadow register-card mt-5">
        <h3 class="text-center text-success fw-bold mb-4">Ro'yxatdan o'tish</h3>
        
        <div class="mb-3">
            <input type="text" id="username" class="form-control" placeholder="Foydalanuvchi nomi (Username)" required>
        </div>
        <div class="mb-3">
            <input type="email" id="email" class="form-control" placeholder="Email manzil" required>
        </div>
        <div class="mb-3">
            <input type="password" id="password" class="form-control" placeholder="Parol" required>
        </div>

        <button class="btn btn-success w-100 fw-bold" onclick="register()">Ro'yxatdan o'tish</button>

        <p class="text-muted mt-3 text-center small">
            Akkauntingiz bormi? <a href="/login-page/" class="text-success fw-bold text-decoration-none">Kirish</a>
        </p>

        <p class="text-danger mt-3 text-center small" id="error"></p>
    </div>
</div>

<script>
async function register() {
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("error");
    
    errorEl.innerText = ""; 

    if(!username || !email || !password) {
        errorEl.innerText = "Iltimos, barcha maydonlarni to'ldiring!";
        return;
    }

    try {
        // Django REST Framework orqali foydalanuvchi yaratish (Ushbu endpoint odatda POST qabul qiladi)
        const response = await fetch("/api/users/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok || response.status === 201) {
            alert("Ro'yxatdan muvaffaqiyatli o'tdingiz! Endi login qilishingiz mumkin.");
            window.location.href = "/login-page/"; // Login sahifasiga o'tkazish
        } else {
            // Backend qaytargan xatoliklarni chiroyli ko'rsatish
            errorEl.innerText = data.username || data.email || data.detail || "Ro'yxatdan o'tishda xatolik!";
        }
    } catch (err) {
        console.error(err);
        errorEl.innerText = "Tarmoqda xatolik yuz berdi.";
    }
}
</script>

</body>
</html>
