<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSave - Taomlar</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen" onload="fetchFoods()">
    <nav class="bg-white shadow px-6 py-4 flex justify-between items-center border-b-2 border-orange-500">
        <h1 class="text-2xl font-bold text-orange-500">FoodSave</h1>
        <button onclick="logout()" class="bg-gray-200 px-4 py-2 rounded-xl text-sm">Chiqish</button>
    </nav>
    <div class="max-w-7xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Mavjud Taomlar (Aksiya va Isrofga qarshi)</h2>
        <div id="foods-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </div>

    <div id="booking-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 relative shadow-2xl">
            <h3 class="text-xl font-bold mb-4" id="modal-title">Bron qilish</h3>
            <form onsubmit="submitReservation(event)" class="space-y-4">
                <input type="hidden" id="modal-food-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ismingiz</label>
                    <input type="text" id="client-name" required class="mt-1 block w-full px-4 py-2 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Telefoningiz</label>
                    <input type="text" id="client-phone" required class="mt-1 block w-full px-4 py-2 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Yetkazish</label>
                    <select id="delivery-type" class="mt-1 block w-full px-4 py-2 border rounded-xl">
                        <option value="pickup">Olib ketish</option>
                        <option value="delivery">Yetkazib berish</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">To'lov</label>
                    <select id="payment-method" class="mt-1 block w-full px-4 py-2 border rounded-xl">
                        <option value="cash">Naqd</option>
                        <option value="card">Karta</option>
                    </select>
                </div>
                <div class="flex space-x-3">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-gray-200 py-2 rounded-xl">Bekor qilish</button>
                    <button type="submit" class="w-1/2 bg-green-500 text-white py-2 rounded-xl">Tasdiqlash</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function fetchFoods() {
            const res = await fetch('/api/foods/');
            const foods = await res.json();
            const container = document.getElementById('foods-container');
            container.innerHTML = '';
            if(foods.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center col-span-3">Hozircha taom kiritilmagan. Admin paneldan (/admin) restoran va taom qo\'shing.</p>';
                return;
            }
            foods.forEach(f => {
                container.innerHTML += `
                    <div class="bg-white rounded-2xl shadow border p-5">
                        <span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-bold uppercase">${f.food_type}</span>
                        <h3 class="text-xl font-bold mt-2">${f.name}</h3>
                        <p class="text-gray-600 text-sm my-2">${f.description || ''}</p>
                        <p class="text-orange-500 font-bold text-lg">${f.price} SO'M</p>
                        <button onclick="openModal(${f.id}, '${f.name}')" class="w-full bg-orange-500 text-white py-2 rounded-xl mt-4">Bron qilish</button>
                    </div>
                `;
            });
        }
        function openModal(id, name) {
            document.getElementById('modal-food-id').value = id;
            document.getElementById('modal-title').innerText = name + " - Bron qilish";
            document.getElementById('booking-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('booking-modal').classList.add('hidden'); }
        async function submitReservation(e) {
            e.preventDefault();
            const data = {
                food: parseInt(document.getElementById('modal-food-id').value),
                client_name: document.getElementById('client-name').value,
                client_phone: document.getElementById('client-phone').value,
                delivery_type: document.getElementById('delivery-type').value,
                payment_method: document.getElementById('payment-method').value
            };
            const res = await fetch('/api/reservations/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if(res.ok) { alert("Muvaffaqiyatli bron qilindi!"); closeModal(); fetchFoods(); }
        }
        function logout() { localStorage.clear(); window.location.href = '/'; }
    </script>
</body>
</html>
