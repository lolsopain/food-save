<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSave - Boshqaruv paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f3f4f6; padding-bottom: 50px; color: #1f2937; }
        nav { background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #ff6b35; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        nav h1 { color: #ff6b35; font-size: 24px; font-weight: bold; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .badge { background: #ffedd5; color: #9a3412; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; text-transform: uppercase; }
        .logout-btn { background: #e5e7eb; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s; }
        .logout-btn:hover { background: #d1d5db; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
        .card { background: white; border-radius: 12px; padding: 25px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card h3 { font-size: 18px; color: #1f2937; margin-bottom: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: #4b5563; margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; transition: 0.2s; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #ff6b35; }
        .btn-submit { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; color: white; cursor: pointer; background: #10b981; font-size: 14px; transition: 0.2s; }
        .btn-submit:hover { background: #059669; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .food-card { background: white; border-radius: 12px; padding: 20px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .food-type-badge { position: absolute; top: 15px; right: 15px; padding: 4px 10px; font-size: 11px; font-weight: bold; border-radius: 20px; text-transform: uppercase; }
        .bg-new { background: #d1fae5; color: #065f46; }
        .bg-leftover { background: #fee2e2; color: #991b1b; }
        .price-text { color: #ff6b35; font-size: 20px; font-weight: bold; margin: 15px 0 5px 0; }
        .btn-book { width: 100%; padding: 11px; background: #ff6b35; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.2s; font-size: 14px; }
        .btn-book:hover { background: #e0531f; }
        .order-item { padding: 12px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; line-height: 1.5; }
        .status-badge { display: inline-block; padding: 2px 6px; font-size: 11px; font-weight: bold; border-radius: 4px; background: #f3f4f6; color: #4b5563; }
        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body onload="initPage()">

    <nav>
        <h1>FoodSave</h1>
        <div class="nav-right">
            <span id="user-badge" class="badge">Yuklanmoqda...</span>
            <button onclick="logout()" class="logout-btn">Chiqish</button>
        </div>
    </nav>

    <div class="container">
        <div id="owner-panel" class="hidden grid-layout">
            <div class="card">
                <h3>🆕 Yangi Aksiya / Taom qo'shish</h3>
                <form onsubmit="addFood(event)">
                    <div class="form-group"><label>Taom nomi</label><input type="text" id="food-name" required placeholder="Masalan: Palov"></div>
                    <div class="form-group"><label>Tavsifi (Tarkibi, vaqti)</label><textarea id="food-desc" rows="2" placeholder="Chegirma soat 22:00 gacha amal qiladi"></textarea></div>
                    <div class="form-group"><label>Narxi (SO'M)</label><input type="number" id="food-price" required placeholder="0"></div>
                    <div class="form-group">
                        <label>Turi</label>
                        <select id="food-type">
                            <option value="new">Yangi (Aksiya)</option>
                            <option value="leftover">Ortib qolgan (Isrofga qarshi)</option>
                        </select>
                    </div>
                    <input type="hidden" id="food-rest-id" value="1">
                    <button type="submit" class="btn-submit">Vitrinaga chiqarish</button>
                </form>
            </div>
            <div class="card">
                <h3>📥 Kelgan Buyurtmalar (Real vaqtda)</h3>
                <div id="orders-container" style="display: flex; flex-direction: column; gap: 12px; max-height: 340px; overflow-y: auto; padding-right: 5px;">
                    <p style="color:#6b7280; text-align:center; padding-top: 20px;">Hozircha buyurtmalar kelmadi.</p>
                </div>
            </div>
        </div>

        <h2 style="color: #1f2937; margin-bottom: 5px; font-weight: 700;">🛒 Mavjud Taomlar va Aksiyalar</h2>
        <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">Oziq-ovqat isrofini birgalikda kamaytiramiz</p>
        <div id="foods-container" class="grid-container"></div>
    </div>

    <div id="booking-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Buyurtma berish</h3>
            <form onsubmit="submitReservation(event)">
                <input type="hidden" id="modal-food-id">
                <div class="form-group"><label>Ismingiz</label><input type="text" id="client-name" required placeholder="Ism familiyangiz"></div>
                <div class="form-group"><label>Telefon raqamingiz</label><input type="text" id="client-phone" required placeholder="+998901234567"></div>
                <div class="form-group">
                    <label>Yetkazib berish usuli</label>
                    <select id="delivery-type">
                        <option value="pickup">Restorandan borib olib ketish</option>
                        <option value="delivery">Kuryer orqali yetkazish</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>To'lov turi</label>
                    <select id="payment-method">
                        <option value="cash">Naqd pul orqali</option>
                        <option value="card">Plastik karta (Click/Payme)</option>
                    </select>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button type="button" onclick="closeModal()" style="width:50%; padding:11px; border-radius:8px; border:1px solid #cbd5e1; background:none; cursor:pointer; font-weight:500;">Bekor qilish</button>
                    <button type="submit" style="width:50%; padding:11px; border-radius:8px; border:none; background:#ff6b35; color:white; font-weight:600; cursor:pointer;">Tasdiqlash</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function getHeaders() {
            const token = localStorage.getItem('access');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        function initPage() {
            const userRole = localStorage.getItem('role') || 'client'; 
            document.getElementById('user-badge').innerText = `Rol: ${userRole}`;
            if(userRole === 'owner') {
                document.getElementById('owner-panel').classList.remove('hidden');
                fetchOrders();
            }
            fetchFoods();
        }

        async function fetchFoods() {
            try {
                const res = await fetch('/api/foods/');
                const foods = await res.json();
                const container = document.getElementById('foods-container');
                container.innerHTML = '';
                if(!foods || foods.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#6b7280; padding: 40px 0;">Hozircha sotuvda taomlar mavjud emas.</p>';
                    return;
                }
                foods.forEach(f => {
                    const badgeClass = f.food_type === 'new' ? 'bg-new' : 'bg-leftover';
                    const badgeText = f.food_type === 'new' ? 'Aksiya' : 'Ortib qolgan';
                    container.innerHTML += `
                        <div class="food-card">
                            <div>
                                <span class="food-type-badge ${badgeClass}">${badgeText}</span>
                                <h3 style="margin-top:25px; font-size: 18px; color:#1f2937;">${f.name}</h3>
                                <p style="font-size:13px; color:#6b7280; margin-top:5px; min-height: 40px;">${f.description || 'Tavsif berilmagan'}</p>
                            </div>
                            <div>
                                <div class="price-text">${Number(f.price).toLocaleString()} SO'M</div>
                                <button onclick="openModal(${f.id}, '${f.name}')" class="btn-book">Buyurtma qilish</button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        async function addFood(e) {
            e.preventDefault();
            const data = {
                restaurant: parseInt(document.getElementById('food-rest-id').value),
                name: document.getElementById('food-name').value,
                description: document.getElementById('food-desc').value,
                price: parseFloat(document.getElementById('food-price').value),
                food_type: document.getElementById('food-type').value,
                is_available: true
            };
            const res = await fetch('/api/foods/', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify(data)
            });
            if(res.ok) { 
                alert("Yangi taom muvaffaqiyatli vitrinaga qo'shildi!"); 
                fetchFoods(); 
                e.target.reset(); 
            } else {
                alert("Xatolik! Ma'lumotlarni tekshiring yoki qayta tizimga kiring.");
            }
        }

        async function fetchOrders() {
            try {
                const res = await fetch('/api/reservations/', { headers: getHeaders() });
                if(!res.ok) return;
                const orders = await res.json();
                const container = document.getElementById('orders-container');
                container.innerHTML = '';
                if(!orders || orders.length === 0) {
                    container.innerHTML = '<p style="color:#6b7280; text-align:center; padding-top:20px;">Hozircha buyurtmalar yo\'q.</p>';
                    return;
                }
                orders.forEach(o => {
                    const delMethod = o.delivery_type === 'pickup' ? 'Borib olish' : 'Kuryer';
                    container.innerHTML += `
                        <div class="order-item">
                            <div style="display:flex; justify-content:between; margin-bottom:4px;">
                                <strong>👤 ${o.client_name}</strong>
                                <span class="status-badge" style="margin-left:auto; background:#d1fae5; color:#065f46;">Yangi</span>
                            </div>
                            <p style="color:#4b5563;">📞 Tel: ${o.client_phone}</p>
                            <p style="color:#4b5563; font-size:12px; margin-top:2px;">📦 Yetkazish: ${delMethod} | To'lov: ${o.payment_method.toUpperCase()}</p>
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        function openModal(id, name) {
            document.getElementById('modal-food-id').value = id;
            document.getElementById('modal-title').innerText = name + " - Buyurtma berish";
            const modal = document.getElementById('booking-modal');
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('booking-modal');
            modal.classList.add('hidden');
            modal.style.display = 'none';
        }

        async function submitReservation(e) {
            e.preventDefault();
            const data = {
                food: parseInt(document.getElementById('modal-food-id').value),
                client_name: document.getElementById('client-name').value,
                client_phone: document.getElementById('client-phone').value,
                delivery_type: document.getElementById('delivery-type').value,
                payment_method: document.getElementById('payment-method').value,
                status: 'pending'
            };
            
            const res = await fetch('/api/reservations/', { 
                method: 'POST', 
                headers: getHeaders(), 
                body: JSON.stringify(data) 
            });
            
            if(res.ok) { 
                alert("Buyurtmangiz muvaffaqiyatli qabul qilindi! Restoran tez orada siz bilan bog'lanadi."); 
                closeModal(); 
                fetchFoods(); 
                if(localStorage.getItem('role') === 'owner') fetchOrders();
            } else {
                alert("Xatolik! Buyurtma yuborilmadi. Tizimga qayta kirib ko'ring.");
            }
        }

        function logout() { localStorage.clear(); window.location.href = '/'; }
    </script>
</body>
</html>
